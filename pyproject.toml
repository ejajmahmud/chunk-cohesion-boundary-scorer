[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chunk-cohesion-boundary-scorer"
version = "0.1.0"
description = "Information-theoretic discourse boundary detector replacing fixed-token chunking with high-cohesion topical paragraph cuts"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
chunk-cohesion-boundary-scorer = "chunk_cohesion_boundary_scorer.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["chunk_cohesion_boundary_scorer*"]
